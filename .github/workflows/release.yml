name: release

# Two things happen here, and only one of them on most runs.
#
# A pull request gets built and tested on every platform, and stops
# there. A `v*` tag gets the same build, then signed, notarized,
# packaged, signed again for the appcast, and published to R2.
#
# There is exactly one real release build per version — the tag's. A PR
# build is a check that the tree compiles, not a candidate artifact.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.1"
  R2_BUCKET: hyperbin-builds
  CDN_URL: https://hyperbin-builds.hypernuclear.com
  SPARKLE_VERSION: "2.9.0"

jobs:
  build:
    # Skip `release/v*` pull requests. They carry no application code —
    # a version bump and a CHANGELOG entry — so building them tests
    # nothing that the feature PRs did not already test, and the tag
    # build immediately afterwards is the real release build. Skipping
    # here is what keeps it to one full build per release instead of two.
    if: |
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'release/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two separate macOS builds rather than one universal binary.
          # The appcast carries a sparkle:cpu on each enclosure, so each
          # machine downloads only its own architecture instead of a
          # bundle that is half dead weight.
          - os: macos-latest
            platform: macos
            arch: arm64
            cmake-args: '-G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64'
            qt-arch: clang_64
          - os: macos-latest
            platform: macos
            arch: x64
            cmake-args: '-G Ninja -DCMAKE_OSX_ARCHITECTURES=x86_64'
            qt-arch: clang_64
          # Pinned, not windows-latest: when GitHub rolls the label
          # forward, CMake's "Visual Studio 17 2022" generator can stop
          # finding an instance of Visual Studio at all.
          - os: windows-2022
            platform: windows
            arch: x64
            cmake-args: '-G "Visual Studio 17 2022" -A x64'
            qt-arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history. The build number is `git rev-list --count HEAD`
          # and a shallow clone returns 1 — which would make every
          # release look older than the one before it, and no update
          # would ever be offered.
          fetch-depth: 0

      - name: Work out the version
        shell: bash
        run: |
          PROJECT="$(sed -n 's/^project(hyperbin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${PROJECT}-pr${{ github.event.number }}"
          fi
          BUILD=$(git rev-list --count HEAD)

          # MSIX gets its own version, and it has to be built rather than
          # borrowed. Its schema takes four dot-separated integers and
          # NOTHING else, so the display version cannot be used: that is
          # only ever clean on a tag, and every pull request packed as
          # "1.0.0-pr4.0" and failed makeappx outright.
          #
          # The last field is the commit count for the same reason
          # CFBundleVersion is — see CMakeLists. Windows compares these to
          # decide what is an upgrade, so two builds of 1.0.0 that both
          # said 1.0.0.0 would be indistinguishable to it. A commit count
          # only ever goes up.
          #
          # Strip any pre-release suffix off a tag first: v1.1.0-beta.2 is
          # a perfectly good tag and not a number.
          MSIX_VERSION="${VERSION%%-*}.${BUILD}"
          if [[ "$BUILD" -gt 65535 ]]; then
            echo "::error::commit count $BUILD exceeds the 65535 an MSIX version field allows"
            exit 1
          fi

          echo "VERSION=$VERSION"           >> $GITHUB_ENV
          echo "BUILD=$BUILD"               >> $GITHUB_ENV
          echo "MSIX_VERSION=$MSIX_VERSION" >> $GITHUB_ENV
          echo "$VERSION" > build-version.txt
          echo "Version $VERSION, build $BUILD, msix $MSIX_VERSION"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          # qtquick3d for the ooze effect's View3D; qtshadertools because
          # Quick3D needs it and qt_add_shaders bakes the fly mask.
          #
          # NOT qtsvg. It is part of the base install in Qt 6, not a
          # separate module, and naming it here fails outright with
          # "The packages ['qtsvg'] were not found while parsing XML" —
          # which reads like the package is missing rather than already
          # present. The tray icon and the marks still get QtSvg.
          modules: qtshadertools qtquick3d
          # Qt 6.11+ on Windows uses a flattened per-arch repo layout that
          # aqtinstall 3.3.0 — the action's default, and the newest on
          # PyPI — cannot parse; it fails with "Failed to locate XML data
          # for Qt version". Fixed on aqt master but not yet released, so
          # install from a pinned SHA. See aqtinstall#959 and PR#1000.
          # Drop this once aqt v3.4+ ships. Kept identical to hypershot's
          # pin so both products move together.
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@75ea7944aeac985e226df0a882cd5b3470e51a97"
          cache: true

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build ${{ matrix.cmake-args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION_BUILD="$BUILD" \
            -DAPP_VERSION_DISPLAY="$VERSION" \
            -DHYPERBIN_COUNTLY_APP_KEY="${{ secrets.COUNTLY_APP_KEY }}" \
            -DHYPERBIN_CODESIGN_IDENTITY=""
          # No -DHYPERBIN_EDDSA_PUBKEY here on purpose. The update
          # signing key's PUBLIC half lives in CMakeLists.txt, not in a
          # secret: it ships inside every binary anyway, so hiding it
          # buys nothing, and as a secret it becomes an invisible input
          # that can silently disagree with the private half. In the
          # tree it is reviewable and diffable.

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        shell: bash
        run: |
          # The sim check is headless by design, so it runs here as-is.
          if [ -f build/simtest ]; then build/simtest
          else build/Release/simtest.exe; fi

      # ===== macOS =====
      - name: Install the Developer ID certificate
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          # A throwaway keychain per run, deleted at the end. Importing
          # into the login keychain on a shared runner would leave a
          # signing identity behind for whatever runs next.
          KEYCHAIN="build-${{ github.run_id }}.keychain"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          echo "$CERT_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
                   -T /usr/bin/codesign
          rm -f cert.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
                   -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> $GITHUB_ENV

      - name: Package macOS
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh build "$VERSION" "${{ matrix.arch }}"

      - name: Notarize
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
        run: |
          DMG="build/hyperbin-${VERSION}-macos-${{ matrix.arch }}.dmg"
          # The bundle is notarized separately from the DMG. Sparkle
          # ships the ZIP of the .app, and a ticket stapled to the DMG
          # does not travel with the app inside it.
          ditto -c -k --sequesterRsrc --keepParent build/hyperbin.app build/notarize.zip
          for f in build/notarize.zip "$DMG"; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          done
          rm -f build/notarize.zip
          xcrun stapler staple build/hyperbin.app
          xcrun stapler staple "$DMG"

      - name: Zip the bundle for Sparkle
        if: runner.os == 'macOS'
        run: |
          # Built from the stapled bundle, so the copy Sparkle installs
          # carries its own notarization ticket and passes Gatekeeper
          # even offline.
          ditto -c -k --sequesterRsrc --keepParent build/hyperbin.app \
                "build/hyperbin-${VERSION}-macos-${{ matrix.arch }}.zip"

      - name: Delete the temporary keychain
        if: runner.os == 'macOS' && always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

      # ===== Windows =====
      - name: Stage and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\windows -Force | Out-Null
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --qmldir qml --compiler-runtime `
              --release --force build\Release\hyperbin.exe
          Copy-Item build\Release\* dist\windows\ -Recurse -Force
          Copy-Item packaging\windows\AppxManifest.xml dist\windows\ -Force
          Copy-Item packaging\windows\Assets dist\windows\Assets -Recurse -Force

          (Get-Content dist\windows\AppxManifest.xml) `
            -replace '\{\{MSIX_VERSION\}\}', "$env:MSIX_VERSION" `
            -replace '\{\{ARCH\}\}', 'x64' | Set-Content dist\windows\AppxManifest.xml
          if (Select-String -Path dist\windows\AppxManifest.xml -Pattern '\{\{') {
            throw "AppxManifest still has an unsubstituted placeholder"
          }

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
                      Sort-Object -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK" }
          & $makeappx.FullName pack /d dist\windows /p "build\hyperbin-$env:VERSION-windows-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

      - name: Sign the MSIX
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_APPLICATION_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the EXE installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $root = (Get-Location).Path
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
              /DAppVersion=$env:VERSION /DStagingDir="$root\dist\windows" `
              /O"$root\build" packaging\windows\hyperbin.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Move-Item "build\hyperbin-setup-$env:VERSION.exe" `
                    "build\hyperbin-$env:VERSION-windows-x64.exe" -Force

      - name: Sign the EXE installer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_APPLICATION_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: EdDSA-sign the installer for WinSparkle
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Signed AFTER Authenticode: signing an exe changes its bytes,
          # so an EdDSA signature made first would not match what the
          # user downloads and WinSparkle would reject the update.
          $tool = Get-ChildItem build\_deps -Recurse -Filter winsparkle-tool.exe |
                  Select-Object -First 1
          if (-not $tool) { throw "winsparkle-tool.exe not found" }
          $keyFile = [System.IO.Path]::GetTempFileName()
          try {
            "${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}" | Set-Content $keyFile -NoNewline
            $sig = & $tool.FullName sign -f $keyFile "build\hyperbin-$env:VERSION-windows-x64.exe"
            if ($LASTEXITCODE -ne 0 -or -not $sig) { throw "EdDSA signing failed" }
            $sig | Set-Content build\eddsa-signature.txt -NoNewline
          } finally {
            Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hyperbin-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/*.dmg
            build/*.zip
            build/*.exe
            build/*.msix
            build/eddsa-signature.txt
            build-version.txt
          if-no-files-found: error
          retention-days: 14

  # --- publish --------------------------------------------------------------
  # Tags only. Both feeds are written in one job so a release can never
  # land half-published, with macOS pointing at a version Windows has not
  # uploaded yet.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same trap as the build job: the Windows appcast's
          # sparkle:version is a commit count, and on a shallow clone
          # that is 1 for every release forever.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Work out the version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build the macOS appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          # The archive's members are ./bin/... at the root — there is no
          # top-level Sparkle-x.y.z/ directory to strip or to name.
          mkdir -p sparkle
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar xJ -C sparkle ./bin/generate_appcast ./bin/sign_update
          test -x sparkle/bin/generate_appcast

          KEY=$(mktemp); printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT

          # One appcast per architecture, then merged. generate_appcast
          # reads a whole directory and emits one <item> per archive; it
          # has no notion of architecture, so the two are produced apart
          # and the sparkle:cpu attribute is added on the way in.
          # Located with find, never by a constructed path.
          #
          # upload-artifact@v4 roots an artifact at the least common
          # ancestor of everything it matched. This job's upload lists
          # both `build/*.zip` and `build-version.txt`, so that ancestor
          # is the workspace and the files arrive under
          # artifacts/<name>/build/… — not artifacts/<name>/. Building the
          # path by hand assumed otherwise and failed here after all three
          # platforms had signed and notarized.
          for ARCH in arm64 x64; do
            mkdir -p "feed-$ARCH"
            ZIP=$(find artifacts -type f -name "hyperbin-*-macos-${ARCH}.zip" | head -1)
            if [ -z "$ZIP" ]; then
              echo "::error::no macOS ${ARCH} zip in the artifacts"
              find artifacts -type f | sed 's/^/  /'
              exit 1
            fi
            cp "$ZIP" "feed-$ARCH/"
            ./sparkle/bin/generate_appcast --ed-key-file "$KEY" \
              --download-url-prefix "${CDN_URL}/releases/${VERSION}/" \
              "feed-$ARCH/"
          done

          ARM=$(sed -n '/<item>/,/<\/item>/p' feed-arm64/appcast.xml \
                | sed 's|<enclosure |<enclosure sparkle:cpu="arm64" |')
          X64=$(sed -n '/<item>/,/<\/item>/p' feed-x64/appcast.xml \
                | sed 's|<enclosure |<enclosure sparkle:cpu="x86_64" |')

          cat > appcast-mac.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
            <channel>
              <title>hyperbin</title>
              ${ARM}
              ${X64}
            </channel>
          </rss>
          EOF
          cat appcast-mac.xml

          # Refuse to publish an unsigned feed.
          #
          # generate_appcast checks the signing key against the
          # SUPublicEDKey baked into the app, and when they disagree it
          # prints a warning, omits sparkle:edSignature, and exits 0. The
          # release then looks completely successful and ships a feed no
          # client will install — which is the safe direction to fail,
          # but only discovered by a user who never gets an update.
          # HYPERBIN_EDDSA_PUBKEY in CMakeLists.txt and the
          # SPARKLE_EDDSA_PRIVATE_KEY secret must be halves of one pair.
          SIGNED=$(grep -c 'sparkle:edSignature' appcast-mac.xml || true)
          if [ "$SIGNED" -ne 2 ]; then
            echo "::error::macOS appcast has $SIGNED signed enclosures, expected 2."
            echo "The app's SUPublicEDKey almost certainly does not match"
            echo "SPARKLE_EDDSA_PRIVATE_KEY. See docs/distribution.md."
            exit 1
          fi

      - name: Build the Windows appcast
        run: |
          # find, not a constructed path — see the macOS appcast step.
          EXE=$(find artifacts -type f -name "hyperbin-*-windows-x64.exe" | head -1)
          SIGFILE=$(find artifacts -type f -name "eddsa-signature.txt" | head -1)
          if [ -z "$EXE" ] || [ -z "$SIGFILE" ]; then
            echo "::error::missing Windows installer or its EdDSA signature"
            find artifacts -type f | sed 's/^/  /'
            exit 1
          fi
          SIG=$(cat "$SIGFILE")
          LEN=$(stat -f%z "$EXE")
          BUILD=$(git rev-list --count "$GITHUB_REF_NAME")
          # sparkle:version is the build number WinSparkle compares;
          # shortVersionString is the string it shows. Swapping them
          # would make every release compare equal.
          cat > appcast-win.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
            <channel>
              <title>hyperbin</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>10.0.19041</sparkle:minimumSystemVersion>
                <enclosure url="${CDN_URL}/releases/${VERSION}/hyperbin-${VERSION}-windows-x64.exe"
                           sparkle:edSignature="${SIG}"
                           length="${LEN}"
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF
          cat appcast-win.xml

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          S3="aws s3 --endpoint-url $R2_ENDPOINT"

          # Artifacts first, feeds last. A feed that names a file nobody
          # has uploaded yet sends every running copy of the app to a
          # 404, and they will have already told the user an update is
          # waiting.
          find artifacts -type f \
               \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.msix' \) \
               -print0 |
          while IFS= read -r -d '' f; do
            $S3 cp "$f" "s3://${R2_BUCKET}/releases/${VERSION}/$(basename "$f")"
          done

          $S3 cp appcast-mac.xml "s3://${R2_BUCKET}/latest/mac/appcast.xml" \
                --content-type application/xml
          $S3 cp appcast-win.xml "s3://${R2_BUCKET}/latest/win/appcast.xml" \
                --content-type application/xml

          echo "Published ${VERSION} to ${CDN_URL}/releases/${VERSION}/"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "hyperbin ${VERSION}" \
            --generate-notes \
            $(find artifacts -type f \
              \( -name '*.dmg' -o -name '*.exe' -o -name '*.msix' \))
