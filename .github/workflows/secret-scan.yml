name: secret-scan

# The repo is public, so a leaked credential is public the moment it
# lands. This is the backstop for anyone who hasn't installed the local
# hook (scripts/install-hooks.sh).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Rules improve over time; re-scan history weekly so a secret that
    # slipped past an older ruleset still gets caught.
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a secret removed in a later
                         # commit is still public in an earlier one

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
