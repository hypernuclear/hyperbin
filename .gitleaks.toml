# gitleaks config. Extends the default ruleset rather than replacing it —
# the built-in rules cover the providers we actually use (GitHub, AWS,
# Slack, private keys), and hand-rolling that list only loses coverage.
[extend]
useDefault = true

[allowlist]
description = "Paths and strings that are not secrets"

paths = [
  '''^build/''',
  '''\.gitleaks\.toml$''',
  '''^third_party/''',
]

# The Team ID is deliberately public: it's embedded in every signed
# binary we ship and readable with `codesign -d` on any distributed app.
# It's an identity, not a credential.
regexes = [
  '''67J6LGVJDP''',
  '''Developer ID Application: Hypernuclear LLC''',
  '''SUPublicEDKey''',
]
